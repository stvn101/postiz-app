# Postiz for CarbonConstruct - single-host production stack.
#
#   cp .env.example .env   # fill it in (see SETUP.md)
#   docker compose up -d
#
# Differences from the repo-root docker-compose.yaml (a local dev stack):
#   - Caddy in front for HTTPS; Postiz itself is not published on the host.
#   - Temporal runs on Postgres only (no Elasticsearch, no Temporal UI/admin
#     containers) - enough for one organisation's scheduling load.
#   - Every value that differs per install comes from .env; provider
#     credentials are limited to LinkedIn, Facebook and Instagram.
#   - Postgres and Redis are internal-only.

services:
  caddy:
    image: caddy:2-alpine
    container_name: postiz-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      POSTIZ_DOMAIN: ${POSTIZ_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - postiz-network
    depends_on:
      - postiz

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      # === Required
      MAIN_URL: 'https://${POSTIZ_DOMAIN}'
      FRONTEND_URL: 'https://${POSTIZ_DOMAIN}'
      NEXT_PUBLIC_BACKEND_URL: 'https://${POSTIZ_DOMAIN}/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: 'postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz'
      REDIS_URL: 'redis://postiz-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      API_LIMIT: ${API_LIMIT:-300}

      # === Storage: local volume, served by Postiz under /uploads
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Providers CarbonConstruct posts to
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}

      # === Optional
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NX_ADD_PLUGINS: 'false'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    expose:
      - '5000'
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # -----------------------
  # Temporal (background jobs: publish workflows, retries)
  # -----------------------
  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - '5432'
    volumes:
      - temporal-postgres-volume:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      - temporal-postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    expose:
      - '7233'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro

volumes:
  postgres-volume:
  temporal-postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  caddy-data:
  caddy-config:

networks:
  postiz-network:
  temporal-network:
